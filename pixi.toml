[workspace]
authors = ["Nathalie Gocht <nathalie.gocht@b-tu.de>"]
channels = ["conda-forge", "bioconda"]
name = "string-dag-cover"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.7,<3.15"
graph-tool = ">=3.0,<4"
plotnine = ">=0.15.7,<0.16"
biopython = ">=1.87,<2"
ncbi-datasets-cli = ">=18.35.0,<19"
numba = ">=0.67.0,<0.68"
pygraphviz = ">=1.14,<2"
python-graphviz = ">=0.21,<0.22"
vg = ">=1.76.1,<2"
vcfpy = ">=0.13.8,<0.14"
ipykernel = ">=7.3.0,<8"
pip = ">=26.2.1,<27"
bitstring = ">=4.4.0,<5"

[pypi-dependencies]
genomeutils = ">=0.1.3, <0.2"
edlib = ">=1.3.9.post1, <2"
quickmers = ">=0.2.1, <0.3"

[feature.test.dependencies]
pytest = "*"


[environments]
default = { features = [] }          
test = { features = ["test"]}  